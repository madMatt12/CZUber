<!DOCTYPE html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Moje jízdy – FaremSpolu</title>
    <meta name="description" content="Přehled tvých jízd jako řidič i pasažér na platformě FaremSpolu." />
    <link rel="icon" type="image/svg+xml" href="assets/img/logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/reset.css" />
    <link rel="stylesheet" href="assets/css/styles.css" />
    <style>
      .my-rides-section { margin-bottom: 2.5rem; }
      .my-rides-section__title {
        font-size: 1.35rem;
        font-weight: 700;
        margin-bottom: 1rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .my-rides-section__title .badge {
        background: var(--clr-primary, #16a34a);
        color: #fff;
        border-radius: 999px;
        font-size: 0.75rem;
        padding: 0.15rem 0.55rem;
        font-weight: 600;
      }
      .ride-card-my {
        background: var(--clr-surface, #fff);
        border: 1px solid var(--clr-border, #e5e7eb);
        border-radius: 0.75rem;
        padding: 1rem 1.25rem;
        margin-bottom: 0.75rem;
        transition: box-shadow 0.2s;
      }
      .ride-card-my:hover { box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
      .ride-card-my__header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        cursor: pointer;
      }
      .ride-card-my__route { font-weight: 600; font-size: 1.05rem; }
      .ride-card-my__meta {
        display: flex;
        gap: 1rem;
        font-size: 0.85rem;
        color: var(--clr-muted, #6b7280);
        margin-top: 0.25rem;
      }
      .ride-card-my__toggle {
        background: none;
        border: none;
        font-size: 1.2rem;
        cursor: pointer;
        padding: 0.25rem 0.5rem;
        border-radius: 0.375rem;
        transition: transform 0.2s;
      }
      .ride-card-my__toggle.is-open { transform: rotate(180deg); }
      .ride-card-my__body {
        margin-top: 0.75rem;
        padding-top: 0.75rem;
        border-top: 1px solid var(--clr-border, #e5e7eb);
      }
      .ride-card-my__body[hidden] { display: none; }

      .request-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.65rem 0;
        border-bottom: 1px solid var(--clr-border, #f3f4f6);
        gap: 1rem;
        flex-wrap: wrap;
      }
      .request-item:last-child { border-bottom: none; }
      .request-item__info { flex: 1; min-width: 200px; }
      .request-item__name { font-weight: 600; }
      .request-item__message {
        font-size: 0.85rem;
        color: var(--clr-muted, #6b7280);
        margin-top: 0.15rem;
        font-style: italic;
      }
      .request-item__actions { display: flex; gap: 0.5rem; }
      .request-item__actions .btn { font-size: 0.8rem; padding: 0.35rem 0.75rem; }

      .status-badge {
        display: inline-block;
        padding: 0.15rem 0.6rem;
        border-radius: 999px;
        font-size: 0.75rem;
        font-weight: 600;
      }
      .status-badge--pending { background: #fef3c7; color: #92400e; }
      .status-badge--approved { background: #d1fae5; color: #065f46; }
      .status-badge--rejected { background: #fee2e2; color: #991b1b; }

      .passenger-card {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: var(--clr-surface, #fff);
        border: 1px solid var(--clr-border, #e5e7eb);
        border-radius: 0.75rem;
        padding: 1rem 1.25rem;
        margin-bottom: 0.75rem;
        gap: 1rem;
        flex-wrap: wrap;
      }
      .passenger-card__route { font-weight: 600; }
      .passenger-card__details {
        font-size: 0.85rem;
        color: var(--clr-muted, #6b7280);
        margin-top: 0.15rem;
      }
      .passenger-card__message {
        font-size: 0.85rem;
        font-style: italic;
        color: var(--clr-muted, #6b7280);
        margin-top: 0.25rem;
      }

      .history-card {
        background: var(--clr-surface, #fff);
        border: 1px solid var(--clr-border, #e5e7eb);
        border-radius: 0.75rem;
        padding: 0.85rem 1.25rem;
        margin-bottom: 0.5rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        opacity: 0.7;
      }
      .history-card__route { font-weight: 500; }
      .history-card__meta { font-size: 0.8rem; color: var(--clr-muted, #6b7280); }

      .empty-state {
        text-align: center;
        padding: 2rem;
        color: var(--clr-muted, #6b7280);
        font-style: italic;
      }
    </style>
  </head>
  <body data-page="my-rides">
    <a class="skip-link" href="#main-content">Přeskočit na obsah</a>
    <header class="site-header" data-component="header"></header>
    <main id="main-content" class="page" tabindex="-1">
      <section class="subhero" data-animate>
        <div class="container subhero__inner">
          <div>
            <p class="eyebrow">Přehled</p>
            <h1 class="subhero__title">Moje jízdy</h1>
            <p class="subhero__subtitle">Spravuj své jízdy jako řidič i pasažér.</p>
          </div>
        </div>
      </section>

      <section class="section" data-animate>
        <div class="container">
          <!-- Sekce 1: Jako řidič -->
          <div class="my-rides-section" id="driver-rides-section">
            <h2 class="my-rides-section__title">
              🚗 Jako řidič
              <span class="badge" data-driver-count>0</span>
            </h2>
            <div data-driver-rides-list>
              <div class="empty-state">Načítám...</div>
            </div>
          </div>

          <!-- Sekce 2: Jako pasažér -->
          <div class="my-rides-section" id="passenger-rides-section">
            <h2 class="my-rides-section__title">
              🎒 Jako pasažér
              <span class="badge" data-passenger-count>0</span>
            </h2>
            <div data-passenger-rides-list>
              <div class="empty-state">Načítám...</div>
            </div>
          </div>

          <!-- Sekce 3: Historie -->
          <div class="my-rides-section" id="history-section">
            <h2 class="my-rides-section__title">📜 Historie</h2>
            <div data-history-list>
              <div class="empty-state">Načítám...</div>
            </div>
          </div>
        </div>
      </section>
    </main>
    <footer class="site-footer" data-component="footer"></footer>

    <script type="module" src="assets/js/pages/myRides.js"></script>
  </body>
</html>
