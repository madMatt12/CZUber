<!DOCTYPE html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Správa jízd – Admin FaremSpolu</title>
    <meta name="description" content="Přehled a moderování jízd platformy FaremSpolu." />
    <link rel="icon" type="image/svg+xml" href="assets/img/logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/reset.css" />
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body>
    <div class="admin-layout">
      <aside class="admin-sidebar" aria-label="Administrátorská navigace">
        <a href="index.html" class="admin-sidebar__brand">
          <img src="assets/img/logo.svg" alt="FaremSpolu" />
          FaremSpolu Admin
        </a>
        <nav class="admin-nav">
          <a href="admin_index.html" class="admin-nav__link">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
            Přehled
          </a>
          <a href="admin_users.html" class="admin-nav__link">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
            Uživatelé
          </a>
          <a href="admin_rides.html" class="admin-nav__link" aria-current="page">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg>
            Správa jízd
          </a>

        </nav>
        <div style="padding: 1rem; margin-top: auto;">
          <button class="btn btn--secondary" style="width: 100%;" onclick="window.location.href='index.html'">Zpět na web</button>
        </div>
      </aside>

      <main class="admin-content">
        <header class="admin-header">
          <h1 class="admin-title">Vytvořené jízdy</h1>
          <div class="site-header__auth">
            <button class="site-header__profile" type="button" aria-label="Profil administrátora">
              <span class="site-header__avatar" aria-hidden="true">AD</span>
              <span class="site-header__profile-name" aria-hidden="true">Admin</span>
            </button>
            <button class="btn btn--ghost" type="button" onclick="sessionStorage.clear(); localStorage.removeItem('auth_token'); window.location.href='landing.html';" style="margin-left: 0.5rem; padding: 0.5rem;" title="Odhlásit" aria-label="Odhlásit">
              <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
            </button>
          </div>
        </header>

        <form class="admin-filters" id="ride-filter-form">
          <div class="input" style="flex: 1; min-width: 200px;">
            <label for="filter-ride-driver" class="sr-only">Hledat řidiče</label>
            <input type="text" id="filter-ride-driver" placeholder="Hledat podle e-mailu řidiče..." />
          </div>
          <div class="input" style="flex: 0 0 auto;">
            <label for="filter-ride-status" class="sr-only">Status jízdy</label>
            <select id="filter-ride-status">
              <option value="">Všechny stavy</option>
              <option value="active">Aktivní</option>
              <option value="completed">Dokončené</option>
              <option value="cancelled">Zrušené</option>
            </select>
          </div>
          <button type="submit" class="btn btn--secondary" style="flex: 0 0 auto;">Filtrovat</button>
        </form>

        <section class="card">
          <div class="table-wrapper">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>Datum a Čas</th>
                  <th>Trasa</th>
                  <th>Řidič</th>
                  <th>Status</th>
                  <th>Akce</th>
                </tr>
              </thead>
              <tbody id="rides-tbody">
                <tr><td colspan="5" style="text-align:center; color: #999;">Načítám…</td></tr>
              </tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <!-- Ride Detail Modal -->
    <div id="ride-detail-overlay" class="admin-modal-overlay" style="display:none;" aria-hidden="true">
      <div class="admin-detail-modal" id="ride-detail-modal" role="dialog" aria-labelledby="ride-detail-title">
        <div class="admin-detail-modal__header">
          <h2 class="admin-detail-modal__title" id="ride-detail-title">
            <span class="admin-detail-modal__title-icon">
              <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg>
            </span>
            <span id="ride-detail-name">Detail jízdy</span>
          </h2>
          <button class="admin-detail-modal__close" id="ride-detail-close" aria-label="Zavřít" title="Zavřít">&times;</button>
        </div>
        <div class="admin-detail-modal__body" id="ride-detail-body">
          <!-- Dynamic content -->
        </div>
        <div class="admin-detail-modal__footer" id="ride-detail-footer">
          <button class="btn btn--edit" id="ride-btn-edit" type="button">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
            Upravit
          </button>
          <button class="btn btn--cancel-edit" id="ride-btn-cancel" type="button" style="display:none;">Zrušit</button>
          <button class="btn btn--save" id="ride-btn-save" type="button" style="display:none;">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"></path></svg>
            Uložit změny
          </button>
        </div>
      </div>
    </div>

    <!-- Toast notification -->
    <div class="toast" id="admin-toast" role="status" aria-live="polite"></div>

    <script>
      const API_BASE = 'api/index.php?action=';
      const token = localStorage.getItem('auth_token') || '';
      const headers = { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token };
      let allRides = [];
      let currentRide = null;
      let isEditing = false;

      const statusMap = { active: 'Aktivní', cancelled: 'Zrušeno', completed: 'Dokončeno', full: 'Plná' };
      const statusClass = { active: 'status--active', cancelled: 'status--blocked', completed: 'status--active', full: 'status--pending' };
      const directionMap = { to: 'Na ČZU', from: 'Z ČZU' };

      // ---- Toast ----
      function showToast(msg, isError) {
        const t = document.getElementById('admin-toast');
        t.textContent = msg;
        t.className = 'toast toast--animated' + (isError ? ' toast--error' : '');
        t.style.opacity = '1'; t.style.transform = 'translateX(0)';
        setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translateX(100%)'; }, 3000);
      }

      function formatDate(iso) {
        if (!iso) return '–';
        const d = new Date(iso);
        return d.toLocaleDateString('cs-CZ') + ' ' + d.toLocaleTimeString('cs-CZ', { hour: '2-digit', minute: '2-digit' });
      }

      function toDatetimeLocal(iso) {
        if (!iso) return '';
        const d = new Date(iso);
        const pad = n => String(n).padStart(2, '0');
        return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
      }

      // ---- Render table ----
      function renderRides(rides) {
        const tbody = document.getElementById('rides-tbody');
        if (!rides.length) {
          tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color: #999;">Žádné jízdy.</td></tr>';
          return;
        }
        tbody.innerHTML = rides.map(r => `
          <tr onclick="openRideDetail(${r.id})" title="Klikni pro detail">
            <td>${formatDate(r.departure)}</td>
            <td><b>${r.origin}</b> → ${r.destination}</td>
            <td>${r.driver_email}</td>
            <td><span class="status ${statusClass[r.status] || ''}">${statusMap[r.status] || r.status}</span></td>
            <td>
              ${r.status === 'active' 
                ? `<button class="btn btn--ghost" style="padding: 0.25rem 0.5rem; font-size: 0.85rem; color: #d12e2e;" onclick="event.stopPropagation(); cancelRide(${r.id})">Zrušit</button>`
                : `<span style="color: #999; font-size: 0.85rem;">–</span>`
              }
            </td>
          </tr>
        `).join('');
      }

      async function loadRides() {
        try {
          const res = await fetch(API_BASE + 'admin/rides', { headers });
          const json = await res.json();
          allRides = Array.isArray(json) ? json : [];
          renderRides(allRides);
        } catch(e) { console.error(e); }
      }

      async function cancelRide(rideId) {
        if (!confirm('Opravdu chceš tuto jízdu zrušit?')) return;
        try {
          await fetch(API_BASE + 'admin/rides', {
            method: 'POST',
            headers,
            body: JSON.stringify({ rideId, action: 'cancel' })
          });
          loadRides();
        } catch(e) { alert('Chyba: ' + e.message); }
      }

      document.getElementById('ride-filter-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const search = document.getElementById('filter-ride-driver').value.toLowerCase();
        const status = document.getElementById('filter-ride-status').value;
        
        let filtered = allRides;
        if (search) filtered = filtered.filter(r => r.driver_email.toLowerCase().includes(search));
        if (status) filtered = filtered.filter(r => r.status === status);
        renderRides(filtered);
      });

      // ---- Modal ----
      function openRideDetail(rideId) {
        currentRide = allRides.find(r => r.id == rideId);
        if (!currentRide) return;
        isEditing = false;
        renderRideDetail();
        const overlay = document.getElementById('ride-detail-overlay');
        overlay.style.display = 'flex';
        overlay.setAttribute('aria-hidden', 'false');
        overlay.classList.remove('closing');
        document.body.style.overflow = 'hidden';
        updateFooterButtons();
      }

      function closeRideDetail() {
        const overlay = document.getElementById('ride-detail-overlay');
        overlay.classList.add('closing');
        setTimeout(() => {
          overlay.style.display = 'none';
          overlay.setAttribute('aria-hidden', 'true');
          overlay.classList.remove('closing');
          document.body.style.overflow = '';
          isEditing = false;
        }, 280);
      }

      function renderRideDetail() {
        const r = currentRide;
        document.getElementById('ride-detail-name').textContent = `${r.origin} → ${r.destination}`;

        document.getElementById('ride-detail-body').innerHTML = `
          <div class="admin-detail-section">
            <div class="admin-detail-section__title">
              <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
              Trasa a čas
            </div>
            <div class="admin-detail-grid">
              <div class="admin-detail-field admin-detail-field--readonly">
                <div class="admin-detail-field__label">ID jízdy</div>
                <div class="admin-detail-field__value">#${r.id}</div>
              </div>
              <div class="admin-detail-field">
                <div class="admin-detail-field__label">Směr</div>
                <div class="admin-detail-field__value">${directionMap[r.direction] || r.direction || '–'}</div>
                <select class="admin-detail-field__select" data-field="direction">
                  <option value="to" ${r.direction==='to'?'selected':''}>Na ČZU</option>
                  <option value="from" ${r.direction==='from'?'selected':''}>Z ČZU</option>
                </select>
              </div>
              <div class="admin-detail-field">
                <div class="admin-detail-field__label">Odkud (start)</div>
                <div class="admin-detail-field__value">${r.origin}</div>
                <input type="text" class="admin-detail-field__input" data-field="origin" value="${r.origin}" />
              </div>
              <div class="admin-detail-field">
                <div class="admin-detail-field__label">Kam (cíl)</div>
                <div class="admin-detail-field__value">${r.destination}</div>
                <input type="text" class="admin-detail-field__input" data-field="destination" value="${r.destination}" />
              </div>
              <div class="admin-detail-field">
                <div class="admin-detail-field__label">Datum odjezdu</div>
                <div class="admin-detail-field__value">${formatDate(r.departure)}</div>
                <input type="datetime-local" class="admin-detail-field__input" data-field="departure" value="${toDatetimeLocal(r.departure)}" />
              </div>
              <div class="admin-detail-field">
                <div class="admin-detail-field__label">Trvání</div>
                <div class="admin-detail-field__value">${r.duration || '–'}</div>
                <input type="text" class="admin-detail-field__input" data-field="duration" value="${r.duration || ''}" placeholder="např. 45 min" />
              </div>
            </div>
          </div>

          <div class="admin-detail-section">
            <div class="admin-detail-section__title">
              <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
              Kapacita a cena
            </div>
            <div class="admin-detail-grid">
              <div class="admin-detail-field">
                <div class="admin-detail-field__label">Kapacita (míst)</div>
                <div class="admin-detail-field__value">${r.capacity}</div>
                <input type="number" class="admin-detail-field__input" data-field="capacity" value="${r.capacity}" min="1" max="20" />
              </div>
              <div class="admin-detail-field">
                <div class="admin-detail-field__label">Cena za osobu</div>
                <div class="admin-detail-field__value">${r.price} Kč</div>
                <input type="number" class="admin-detail-field__input" data-field="price" value="${r.price}" min="0" step="1" />
              </div>
              <div class="admin-detail-field">
                <div class="admin-detail-field__label">Status</div>
                <div class="admin-detail-field__value"><span class="status ${statusClass[r.status] || ''}">${statusMap[r.status] || r.status}</span></div>
                <select class="admin-detail-field__select" data-field="status">
                  <option value="active" ${r.status==='active'?'selected':''}>Aktivní</option>
                  <option value="full" ${r.status==='full'?'selected':''}>Plná</option>
                  <option value="completed" ${r.status==='completed'?'selected':''}>Dokončeno</option>
                  <option value="cancelled" ${r.status==='cancelled'?'selected':''}>Zrušeno</option>
                </select>
              </div>
            </div>
          </div>

          <div class="admin-detail-section">
            <div class="admin-detail-section__title">
              <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
              Řidič
            </div>
            <div class="admin-detail-grid">
              <div class="admin-detail-field admin-detail-field--readonly">
                <div class="admin-detail-field__label">Jméno řidiče</div>
                <div class="admin-detail-field__value">${r.first_name} ${r.last_name}</div>
              </div>
              <div class="admin-detail-field admin-detail-field--readonly">
                <div class="admin-detail-field__label">E-mail řidiče</div>
                <div class="admin-detail-field__value">${r.driver_email}</div>
              </div>
            </div>
          </div>

          <div class="admin-detail-section">
            <div class="admin-detail-section__title">
              <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
              Poznámky a metadata
            </div>
            <div class="admin-detail-grid">
              <div class="admin-detail-field admin-detail-field--full">
                <div class="admin-detail-field__label">Poznámky</div>
                <div class="admin-detail-field__value">${r.notes || '–'}</div>
                <textarea class="admin-detail-field__textarea" data-field="notes" placeholder="Poznámky k jízdě...">${r.notes || ''}</textarea>
              </div>
              <div class="admin-detail-field admin-detail-field--readonly">
                <div class="admin-detail-field__label">Vytvořeno</div>
                <div class="admin-detail-field__value">${formatDate(r.created_at)}</div>
              </div>
            </div>
          </div>

          <div class="admin-detail-section">
            <div class="admin-detail-section__title">
              <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
              Žádosti o místo <span style="font-weight:400; color: var(--color-gray-500); font-size: 0.75rem; margin-left: 0.3rem;">(${(r.requests || []).length})</span>
            </div>
            <div class="admin-detail-requests">
              ${(r.requests && r.requests.length > 0) ? r.requests.map(req => {
                const reqStatusMap = { pending: 'Čeká', approved: 'Přijato', rejected: 'Zamítnuto' };
                const reqStatusClass = { pending: 'status--pending', approved: 'status--active', rejected: 'status--blocked' };
                return `
                <div class="admin-detail-request-card" data-request-id="${req.id}">
                  <div class="admin-detail-request-card__header">
                    <span class="admin-detail-request-card__passenger">${req.passenger_first_name} ${req.passenger_last_name}</span>
                    <span class="status ${reqStatusClass[req.status] || ''}" data-request-status-badge="${req.id}">${reqStatusMap[req.status] || req.status}</span>
                  </div>
                  <div class="admin-detail-request-card__email">${req.passenger_email}</div>
                  ${req.message ? `<div class="admin-detail-request-card__message">"${req.message}"</div>` : ''}
                  <div class="admin-detail-request-card__meta">
                    <span class="admin-detail-request-card__date">${formatDate(req.created_at)}</span>
                    <select class="admin-detail-request-card__status-select" data-request-select="${req.id}">
                      <option value="pending" ${req.status==='pending'?'selected':''}>Čeká</option>
                      <option value="approved" ${req.status==='approved'?'selected':''}>Přijato</option>
                      <option value="rejected" ${req.status==='rejected'?'selected':''}>Zamítnuto</option>
                    </select>
                  </div>
                </div>
                `;
              }).join('') : '<div class="admin-detail-empty">Žádné žádosti o místo</div>'}
            </div>
          </div>
        `;
      }

      function updateFooterButtons() {
        const modal = document.getElementById('ride-detail-modal');
        const btnEdit = document.getElementById('ride-btn-edit');
        const btnCancel = document.getElementById('ride-btn-cancel');
        const btnSave = document.getElementById('ride-btn-save');

        if (isEditing) {
          modal.classList.add('admin-detail-modal--editing');
          btnEdit.style.display = 'none';
          btnCancel.style.display = 'inline-flex';
          btnSave.style.display = 'inline-flex';
        } else {
          modal.classList.remove('admin-detail-modal--editing');
          btnEdit.style.display = 'inline-flex';
          btnCancel.style.display = 'none';
          btnSave.style.display = 'none';
        }
      }

      // Edit button
      document.getElementById('ride-btn-edit').addEventListener('click', () => {
        isEditing = true;
        updateFooterButtons();
      });

      // Cancel button
      document.getElementById('ride-btn-cancel').addEventListener('click', () => {
        isEditing = false;
        renderRideDetail();
        updateFooterButtons();
      });

      // Save button
      document.getElementById('ride-btn-save').addEventListener('click', async () => {
        const body = document.getElementById('ride-detail-body');
        const payload = { rideId: currentRide.id };

        body.querySelectorAll('[data-field]').forEach(el => {
          let val = el.value;
          // Convert datetime-local back to MySQL format
          if (el.dataset.field === 'departure' && val) {
            val = val.replace('T', ' ') + ':00';
          }
          // Convert numeric fields
          if (el.dataset.field === 'capacity') val = parseInt(val);
          if (el.dataset.field === 'price') val = parseFloat(val);
          payload[el.dataset.field] = val;
        });

        // Collect ride request status changes
        const requestUpdates = [];
        body.querySelectorAll('[data-request-select]').forEach(sel => {
          const reqId = parseInt(sel.dataset.requestSelect);
          const origReq = (currentRide.requests || []).find(rr => rr.id == reqId);
          if (origReq && sel.value !== origReq.status) {
            requestUpdates.push({ id: reqId, status: sel.value });
          }
        });
        if (requestUpdates.length > 0) {
          payload.requests = requestUpdates;
        }

        try {
          const res = await fetch(API_BASE + 'admin/rides', {
            method: 'PUT',
            headers,
            body: JSON.stringify(payload)
          });
          const json = await res.json();
          if (json.error) {
            showToast('Chyba: ' + json.error, true);
            return;
          }
          showToast('Jízda úspěšně aktualizována!');
          isEditing = false;
          await loadRides();
          currentRide = allRides.find(r => r.id == currentRide.id);
          if (currentRide) {
            renderRideDetail();
          }
          updateFooterButtons();
        } catch(e) {
          showToast('Chyba při ukládání: ' + e.message, true);
        }
      });

      // Close modal
      document.getElementById('ride-detail-close').addEventListener('click', closeRideDetail);

      // Close on overlay click
      document.getElementById('ride-detail-overlay').addEventListener('click', (e) => {
        if (e.target === e.currentTarget) closeRideDetail();
      });

      // Close on Escape
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          const overlay = document.getElementById('ride-detail-overlay');
          if (overlay.style.display !== 'none') closeRideDetail();
        }
      });

      loadRides();
    </script>
  </body>
</html>
