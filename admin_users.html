<!DOCTYPE html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Správa uživatelů – Admin FaremSpolu</title>
    <meta name="description" content="Správa uživatelů na platformě FaremSpolu." />
    <link rel="icon" type="image/svg+xml" href="assets/img/logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/reset.css" />
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body>
    <div class="admin-layout">
      <aside class="admin-sidebar" aria-label="Administrátorská navigace">
        <a href="index.html" class="admin-sidebar__brand">
          <img src="assets/img/logo.svg" alt="FaremSpolu" />
          FaremSpolu Admin
        </a>
        <nav class="admin-nav">
          <a href="admin_index.html" class="admin-nav__link">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
            Přehled
          </a>
          <a href="admin_users.html" class="admin-nav__link" aria-current="page">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
            Uživatelé
          </a>
          <a href="admin_rides.html" class="admin-nav__link">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg>
            Správa jízd
          </a>

        </nav>
        <div style="padding: 1rem; margin-top: auto;">
          <button class="btn btn--secondary" style="width: 100%;" onclick="window.location.href='index.html'">Zpět na web</button>
        </div>
      </aside>

      <main class="admin-content">
        <header class="admin-header">
          <h1 class="admin-title">Uživatelé platformy</h1>
          <div class="site-header__auth">
            <button class="site-header__profile" type="button" aria-label="Profil administrátora">
              <span class="site-header__avatar" aria-hidden="true">AD</span>
              <span class="site-header__profile-name" aria-hidden="true">Admin</span>
            </button>
            <button class="btn btn--ghost" type="button" onclick="sessionStorage.clear(); localStorage.removeItem('auth_token'); window.location.href='landing.html';" style="margin-left: 0.5rem; padding: 0.5rem;" title="Odhlásit" aria-label="Odhlásit">
              <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
            </button>
          </div>
        </header>

        <form class="admin-filters" id="user-filter-form">
          <div class="input" style="flex: 1; min-width: 200px;">
            <label for="filter-user-search" class="sr-only">Hledat uživatele</label>
            <input type="text" id="filter-user-search" placeholder="Hledat podle jména nebo e-mailu..." />
          </div>
          <div class="input" style="flex: 0 0 auto;">
            <label for="filter-user-role" class="sr-only">Role</label>
            <select id="filter-user-role">
              <option value="">Všechny role</option>
              <option value="student">Student</option>
              <option value="admin">Admin</option>
            </select>
          </div>
          <div class="input" style="flex: 0 0 auto;">
            <label for="filter-user-status" class="sr-only">Status</label>
            <select id="filter-user-status">
              <option value="">Všechny stavy</option>
              <option value="active">Aktivní</option>
              <option value="blocked">Zablokovaní</option>
            </select>
          </div>
          <button type="submit" class="btn btn--secondary" style="flex: 0 0 auto;">Filtrovat</button>
        </form>

        <section class="card">
          <div class="table-wrapper">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>E-mail</th>
                  <th>Jméno a Příjmení</th>
                  <th>Role</th>
                  <th>Status Účtu</th>
                  <th>Akce</th>
                </tr>
              </thead>
              <tbody id="users-tbody">
                <tr><td colspan="5" style="text-align:center; color: #999;">Načítám…</td></tr>
              </tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <!-- Detail modal container -->
    <div id="user-detail-overlay" class="admin-modal-overlay" style="display:none;" aria-hidden="true">
      <div class="admin-detail-modal" id="user-detail-modal" role="dialog" aria-labelledby="user-detail-title">
        <div class="admin-detail-modal__header">
          <h2 class="admin-detail-modal__title" id="user-detail-title">
            <span class="admin-detail-modal__title-icon">
              <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
            </span>
            <span id="user-detail-name">Detail uživatele</span>
          </h2>
          <button class="admin-detail-modal__close" id="user-detail-close" aria-label="Zavřít" title="Zavřít">&times;</button>
        </div>
        <div class="admin-detail-modal__body" id="user-detail-body">
          <!-- Dynamic content -->
        </div>
        <div class="admin-detail-modal__footer" id="user-detail-footer">
          <button class="btn btn--edit" id="user-btn-edit" type="button">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
            Upravit
          </button>
          <button class="btn btn--cancel-edit" id="user-btn-cancel" type="button" style="display:none;">Zrušit</button>
          <button class="btn btn--save" id="user-btn-save" type="button" style="display:none;">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"></path></svg>
            Uložit změny
          </button>
        </div>
      </div>
    </div>

    <!-- Toast notification -->
    <div class="toast" id="admin-toast" role="status" aria-live="polite"></div>

    <script>
      const API_BASE = 'api/index.php?action=';
      const token = localStorage.getItem('auth_token') || '';
      const headers = { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token };
      let allUsers = [];
      let currentUser = null;
      let isEditing = false;

      const genderMap = { male: 'Muž', female: 'Žena', other: 'Jiné' };
      const engineMap = { benzin: 'Benzín', diesel: 'Diesel', lpg: 'LPG', electro: 'Elektro', hybrid: 'Hybrid' };

      // ---- Toast ----
      function showToast(msg, isError) {
        const t = document.getElementById('admin-toast');
        t.textContent = msg;
        t.className = 'toast toast--animated' + (isError ? ' toast--error' : '');
        t.style.opacity = '1'; t.style.transform = 'translateX(0)';
        setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translateX(100%)'; }, 3000);
      }

      // ---- Render table ----
      function renderUsers(users) {
        const tbody = document.getElementById('users-tbody');
        if (!users.length) {
          tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color: #999;">Žádní uživatelé.</td></tr>';
          return;
        }
        const statusMap = { active: 'Aktivní', blocked: 'Zablokován' };
        const statusClass = { active: 'status--active', blocked: 'status--blocked' };
        
        tbody.innerHTML = users.map(u => `
          <tr onclick="openUserDetail(${u.id})" title="Klikni pro detail">
            <td>${u.email}</td>
            <td>${u.first_name} ${u.last_name}</td>
            <td>${u.role === 'admin' ? 'Admin' : 'Student'}</td>
            <td><span class="status ${statusClass[u.status] || 'status--active'}">${statusMap[u.status] || u.status}</span></td>
            <td>
              ${u.status === 'blocked' 
                ? `<button class="btn btn--ghost" style="padding: 0.25rem 0.75rem; font-size: 0.9rem;" onclick="event.stopPropagation(); toggleUser(${u.id}, 'unblock')">Odblokovat</button>`
                : `<button class="btn btn--ghost" style="padding: 0.25rem 0.75rem; font-size: 0.9rem;" onclick="event.stopPropagation(); toggleUser(${u.id}, 'block')">Zablokovat</button>`
              }
            </td>
          </tr>
        `).join('');
      }

      async function loadUsers() {
        try {
          const res = await fetch(API_BASE + 'admin/users', { headers });
          const json = await res.json();
          allUsers = Array.isArray(json) ? json : [];
          renderUsers(allUsers);
        } catch(e) { console.error(e); }
      }

      async function toggleUser(userId, action) {
        try {
          await fetch(API_BASE + 'admin/users', {
            method: 'POST',
            headers,
            body: JSON.stringify({ userId, action })
          });
          loadUsers();
        } catch(e) { alert('Chyba: ' + e.message); }
      }

      document.getElementById('user-filter-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const search = document.getElementById('filter-user-search').value.toLowerCase();
        const role = document.getElementById('filter-user-role').value;
        const status = document.getElementById('filter-user-status').value;
        
        let filtered = allUsers;
        if (search) filtered = filtered.filter(u => u.email.toLowerCase().includes(search) || (u.first_name + ' ' + u.last_name).toLowerCase().includes(search));
        if (role) filtered = filtered.filter(u => u.role === role);
        if (status) filtered = filtered.filter(u => u.status === status);
        renderUsers(filtered);
      });

      // ---- Modal ----
      function openUserDetail(userId) {
        currentUser = allUsers.find(u => u.id == userId);
        if (!currentUser) return;
        isEditing = false;
        renderUserDetail();
        const overlay = document.getElementById('user-detail-overlay');
        overlay.style.display = 'flex';
        overlay.setAttribute('aria-hidden', 'false');
        overlay.classList.remove('closing');
        document.body.style.overflow = 'hidden';
        updateFooterButtons();
      }

      function closeUserDetail() {
        const overlay = document.getElementById('user-detail-overlay');
        overlay.classList.add('closing');
        setTimeout(() => {
          overlay.style.display = 'none';
          overlay.setAttribute('aria-hidden', 'true');
          overlay.classList.remove('closing');
          document.body.style.overflow = '';
          isEditing = false;
        }, 280);
      }

      function formatDate(iso) {
        if (!iso) return '–';
        const d = new Date(iso);
        return d.toLocaleDateString('cs-CZ') + ' ' + d.toLocaleTimeString('cs-CZ', { hour: '2-digit', minute: '2-digit' });
      }

      function renderUserDetail() {
        const u = currentUser;
        const name = u.first_name + ' ' + u.last_name;
        document.getElementById('user-detail-name').textContent = name;
        
        const statusMap = { active: 'Aktivní', blocked: 'Zablokován' };
        const statusClass = { active: 'status--active', blocked: 'status--blocked' };

        let vehiclesReadHtml = '';
        if (u.vehicles && u.vehicles.length > 0) {
          vehiclesReadHtml = u.vehicles.map(v => `
            <div class="admin-detail-vehicle-card">
              <div class="admin-detail-vehicle-card__header">
                <span class="admin-detail-vehicle-card__name">${v.brand} ${v.model}</span>
                <span class="admin-detail-vehicle-card__badge">${engineMap[v.engine_type] || v.engine_type}</span>
              </div>
              <div class="admin-detail-vehicle-card__grid">
                <div>
                  <div class="admin-detail-vehicle-card__field-label">SPZ</div>
                  <div class="admin-detail-vehicle-card__field-value">${v.plate}</div>
                </div>
                <div>
                  <div class="admin-detail-vehicle-card__field-label">Barva</div>
                  <div class="admin-detail-vehicle-card__field-value">${v.color}</div>
                </div>
              </div>
              <div class="admin-detail-vehicle-card__edit-grid" data-vehicle-id="${v.id}">
                <div>
                  <label>Značka</label>
                  <input class="admin-detail-field__input" data-vfield="brand" value="${v.brand}" />
                </div>
                <div>
                  <label>Model</label>
                  <input class="admin-detail-field__input" data-vfield="model" value="${v.model}" />
                </div>
                <div>
                  <label>SPZ</label>
                  <input class="admin-detail-field__input" data-vfield="plate" value="${v.plate}" />
                </div>
                <div>
                  <label>Barva</label>
                  <input class="admin-detail-field__input" data-vfield="color" value="${v.color}" />
                </div>
                <div>
                  <label>Palivo</label>
                  <select class="admin-detail-field__select" data-vfield="engine_type">
                    <option value="benzin" ${v.engine_type==='benzin'?'selected':''}>Benzín</option>
                    <option value="diesel" ${v.engine_type==='diesel'?'selected':''}>Diesel</option>
                    <option value="lpg" ${v.engine_type==='lpg'?'selected':''}>LPG</option>
                    <option value="electro" ${v.engine_type==='electro'?'selected':''}>Elektro</option>
                    <option value="hybrid" ${v.engine_type==='hybrid'?'selected':''}>Hybrid</option>
                  </select>
                </div>
              </div>
            </div>
          `).join('');
        } else {
          vehiclesReadHtml = '<div class="admin-detail-empty">Žádná registrovaná vozidla</div>';
        }

        document.getElementById('user-detail-body').innerHTML = `
          <div class="admin-detail-section">
            <div class="admin-detail-section__title">
              <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
              Osobní údaje
            </div>
            <div class="admin-detail-grid">
              <div class="admin-detail-field admin-detail-field--readonly">
                <div class="admin-detail-field__label">ID</div>
                <div class="admin-detail-field__value">#${u.id}</div>
              </div>
              <div class="admin-detail-field">
                <div class="admin-detail-field__label">E-mail</div>
                <div class="admin-detail-field__value">${u.email}</div>
                <input type="email" class="admin-detail-field__input" data-field="email" value="${u.email}" />
              </div>
              <div class="admin-detail-field">
                <div class="admin-detail-field__label">Jméno</div>
                <div class="admin-detail-field__value">${u.first_name}</div>
                <input type="text" class="admin-detail-field__input" data-field="first_name" value="${u.first_name}" />
              </div>
              <div class="admin-detail-field">
                <div class="admin-detail-field__label">Příjmení</div>
                <div class="admin-detail-field__value">${u.last_name}</div>
                <input type="text" class="admin-detail-field__input" data-field="last_name" value="${u.last_name}" />
              </div>
              <div class="admin-detail-field">
                <div class="admin-detail-field__label">Pohlaví</div>
                <div class="admin-detail-field__value">${genderMap[u.gender] || u.gender || '–'}</div>
                <select class="admin-detail-field__select" data-field="gender">
                  <option value="male" ${u.gender==='male'?'selected':''}>Muž</option>
                  <option value="female" ${u.gender==='female'?'selected':''}>Žena</option>
                  <option value="other" ${u.gender==='other'?'selected':''}>Jiné</option>
                </select>
              </div>
            </div>
          </div>

          <div class="admin-detail-section">
            <div class="admin-detail-section__title">
              <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
              Nastavení účtu
            </div>
            <div class="admin-detail-grid">
              <div class="admin-detail-field">
                <div class="admin-detail-field__label">Role</div>
                <div class="admin-detail-field__value">${u.role === 'admin' ? 'Admin' : 'Student'}</div>
                <select class="admin-detail-field__select" data-field="role">
                  <option value="student" ${u.role==='student'?'selected':''}>Student</option>
                  <option value="admin" ${u.role==='admin'?'selected':''}>Admin</option>
                </select>
              </div>
              <div class="admin-detail-field">
                <div class="admin-detail-field__label">Status</div>
                <div class="admin-detail-field__value"><span class="status ${statusClass[u.status] || ''}">${statusMap[u.status] || u.status}</span></div>
                <select class="admin-detail-field__select" data-field="status">
                  <option value="active" ${u.status==='active'?'selected':''}>Aktivní</option>
                  <option value="blocked" ${u.status==='blocked'?'selected':''}>Zablokován</option>
                </select>
              </div>
              <div class="admin-detail-field admin-detail-field--readonly">
                <div class="admin-detail-field__label">Registrace</div>
                <div class="admin-detail-field__value">${formatDate(u.created_at)}</div>
              </div>
            </div>
          </div>

          <div class="admin-detail-section">
            <div class="admin-detail-section__title">
              <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
              Vozidla uživatele
            </div>
            <div class="admin-detail-vehicles" id="user-vehicles-container">
              ${vehiclesReadHtml}
            </div>
          </div>
        `;
      }

      function updateFooterButtons() {
        const modal = document.getElementById('user-detail-modal');
        const btnEdit = document.getElementById('user-btn-edit');
        const btnCancel = document.getElementById('user-btn-cancel');
        const btnSave = document.getElementById('user-btn-save');

        if (isEditing) {
          modal.classList.add('admin-detail-modal--editing');
          btnEdit.style.display = 'none';
          btnCancel.style.display = 'inline-flex';
          btnSave.style.display = 'inline-flex';
        } else {
          modal.classList.remove('admin-detail-modal--editing');
          btnEdit.style.display = 'inline-flex';
          btnCancel.style.display = 'none';
          btnSave.style.display = 'none';
        }
      }

      // Edit button
      document.getElementById('user-btn-edit').addEventListener('click', () => {
        isEditing = true;
        updateFooterButtons();
      });

      // Cancel button
      document.getElementById('user-btn-cancel').addEventListener('click', () => {
        isEditing = false;
        renderUserDetail(); // Reset values
        updateFooterButtons();
      });

      // Save button
      document.getElementById('user-btn-save').addEventListener('click', async () => {
        const body = document.getElementById('user-detail-body');
        const payload = { userId: currentUser.id };

        // Collect user fields
        body.querySelectorAll('[data-field]').forEach(el => {
          payload[el.dataset.field] = el.value;
        });

        // Collect vehicle edits
        const vehicleEdits = [];
        body.querySelectorAll('[data-vehicle-id]').forEach(editGrid => {
          const vId = editGrid.dataset.vehicleId;
          const vData = { id: parseInt(vId) };
          editGrid.querySelectorAll('[data-vfield]').forEach(inp => {
            vData[inp.dataset.vfield] = inp.value;
          });
          vehicleEdits.push(vData);
        });
        if (vehicleEdits.length > 0) {
          payload.vehicles = vehicleEdits;
        }

        try {
          const res = await fetch(API_BASE + 'admin/users', {
            method: 'PUT',
            headers,
            body: JSON.stringify(payload)
          });
          const json = await res.json();
          if (json.error) {
            showToast('Chyba: ' + json.error, true);
            return;
          }
          showToast('Uživatel úspěšně aktualizován!');
          isEditing = false;
          await loadUsers();
          // Refresh current user data
          currentUser = allUsers.find(u => u.id == currentUser.id);
          if (currentUser) {
            renderUserDetail();
          }
          updateFooterButtons();
        } catch(e) {
          showToast('Chyba při ukládání: ' + e.message, true);
        }
      });

      // Close modal
      document.getElementById('user-detail-close').addEventListener('click', closeUserDetail);

      // Close on overlay click
      document.getElementById('user-detail-overlay').addEventListener('click', (e) => {
        if (e.target === e.currentTarget) closeUserDetail();
      });

      // Close on Escape
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          const overlay = document.getElementById('user-detail-overlay');
          if (overlay.style.display !== 'none') closeUserDetail();
        }
      });

      loadUsers();
    </script>
  </body>
</html>
